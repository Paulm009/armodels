limit_req_zone $binary_remote_addr zone=armodels_api:10m rate=10r/s;
limit_req_zone $binary_remote_addr zone=armodels_admin:1m rate=2r/s;
limit_conn_zone $binary_remote_addr zone=armodels_connections:1m;

server {
    listen 80;
    listen [::]:80;
    server_name armodels.dsmerch.com;

    location ^~ /.well-known/acme-challenge/ {
        root /var/lib/armodels-acme;
        try_files $uri =404;
    }
    location / { return 301 https://armodels.dsmerch.com$request_uri; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name armodels.dsmerch.com;

    ssl_certificate /etc/letsencrypt/live/armodels.dsmerch.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/armodels.dsmerch.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:armodels_tls:1m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;
    server_tokens off;
    auth_basic off;

    client_max_body_size 1m;
    client_body_timeout 15s;
    client_header_timeout 15s;
    keepalive_timeout 30s;
    limit_conn armodels_connections 20;
    limit_req_status 429;
    limit_conn_status 429;

    access_log /var/log/nginx/armodels.access.log;
    error_log /var/log/nginx/armodels.error.log warn;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Permissions-Policy "camera=(self), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "base-uri 'self'; object-src 'none'; frame-ancestors 'none'" always;

    location ~ /\. { return 404; }

    location ~* ^/api/v1/admin(?:/|$) {
        limit_req zone=armodels_admin burst=10 nodelay;
        include /etc/nginx/armodels/proxy-common.conf;
        # Demo público: el proxy concede edición sin autenticar al visitante.
        proxy_set_header X-Armodels-Admin-User "demo-publico";
        include /etc/nginx/armodels/admin-proxy.conf;
        proxy_pass http://127.0.0.1:18091;
    }

    location /api/ {
        limit_req zone=armodels_api burst=30 nodelay;
        include /etc/nginx/armodels/proxy-public.conf;
        proxy_pass http://127.0.0.1:18091;
    }

    location /assets/ {
        include /etc/nginx/armodels/proxy-public.conf;
        proxy_pass http://127.0.0.1:18091;
    }
    location /media/ {
        include /etc/nginx/armodels/proxy-public.conf;
        proxy_pass http://127.0.0.1:18091;
    }
    location /image-targets/ {
        include /etc/nginx/armodels/proxy-public.conf;
        proxy_pass http://127.0.0.1:18091;
    }

    # Demo público por indicación del propietario, incluido el panel de edición.
    location / {
        limit_req zone=armodels_admin burst=10 nodelay;
        include /etc/nginx/armodels/proxy-public.conf;
        proxy_pass http://127.0.0.1:18091;
    }
}
